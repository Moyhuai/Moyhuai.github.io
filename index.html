<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Moyhuai</title>
    <style>
      /* 淡入淡出过渡 */
      .loading-fade-enter-active,
      .loading-fade-leave-active {
        transition: opacity 0.5s ease;
      }

      .loading-fade-enter-from,
      .loading-fade-leave-to {
        opacity: 0;
      }

      /* 浮动动画 */
      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      /* 脉冲动画 */
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Loading Screen 容器 */
      #loading-screen {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white;
        transition: all 1s;
      }

      #loading-screen.hide {
        opacity: 0;
        pointer-events: none;
      }

      /* 深色模式支持 */
      @media (prefers-color-scheme: dark) {
        #loading-screen {
          background-color: #111827;
        }
      }

      /* 背景装饰容器 */
      #background-blobs {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
      }

      /* 头像和名字容器 */
      #loading-screen > div.flex {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        position: relative;
        z-index: 1;
      }

      /* 头像容器 */
      .avatar-container {
        position: relative;
      }

      .avatar-container:hover .avatar-glow {
        opacity: 1;
      }

      /* 头像图片 */
      .avatar-container img {
        position: relative;
        width: 8rem;
        height: 8rem;
        border-radius: 9999px;
        border: 4px solid white;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        object-fit: cover;
      }

      @media (prefers-color-scheme: dark) {
        .avatar-container img {
          border-color: #374151;
        }
      }

      @media (min-width: 768px) {
        .avatar-container img {
          width: 10rem;
          height: 10rem;
        }
      }

      /* 名字标题 */
      .name-title {
        font-size: 2.25rem;
        font-weight: 700;
        background-image: linear-gradient(to right, #2563eb, #9333ea, #db2777);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.025em;
      }

      @media (min-width: 768px) {
        .name-title {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <!-- 背景装饰组件 -->
      <div id="background-blobs"></div>

      <!-- 头像和名字 -->
      <div class="flex">
        <!-- 头像 -->
        <div class="avatar-container">
          <img
            src="/avatar.png"
            alt="Moyhuai"
            class="animate-float"
            onerror="this.src='/avatar.png'"
          />
        </div>
      <!-- 名字 -->
        <h1 class="name-title animate-pulse">
          Moyhuai
        </h1>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    
  </body>
</html>
